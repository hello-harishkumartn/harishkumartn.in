name: Enable GitHub Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enable-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Create or update Pages site from gh-pages
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || echo "create failed"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f "cname=harishkumartn.in" -f "source[branch]=gh-pages" -f "source[path]=/" || echo "update failed"
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
