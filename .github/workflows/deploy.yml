name: Deploy site to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binary assets
        run: |
          set -e
          find site -type f -name '*.b64' | while read -r f; do
            base64 -d "$f" > "${f%.b64}"
            rm "$f"
          done
          touch site/.nojekyll
          echo "files: $(find site -type f | wc -l)"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: harishkumartn.in
          force_orphan: true
